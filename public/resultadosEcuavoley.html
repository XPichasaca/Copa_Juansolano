<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ecuavóley – Resultados y Posiciones</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f9fc;
  padding: 15px;
}

h2 {
  margin-top: 25px;
  color: #1f3c88;
}

select {
  padding: 6px;
  margin-bottom: 10px;
}

table {
  border-collapse: collapse;
  width: 100%;
  background: white;
  margin-top: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

th, td {
  border: 1px solid #ccc;
  padding: 6px;
  text-align: center;
  font-size: 14px;
}

thead tr:first-child th {
  background: #1f3c88;
  color: white;
}

thead tr:nth-child(2) th {
  background: #3f72af;
  color: white;
  font-size: 12px;
}

td img {
  vertical-align: middle;
  margin-right: 6px;
  border-radius: 4px;
}

.equipo {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: center;
}

.set {
  font-weight: bold;
}

hr {
  margin: 30px 0;
}
</style>
</head>

<body>

<h2>🏐 Resultados Ecuavóley</h2>

<select id="filtroCategoria"></select>

<table>
<thead>
<tr>
  <th rowspan="2">Fecha</th>
  <th rowspan="2">Equipo A</th>
  <th rowspan="2">Equipo B</th>
  <th colspan="2">Set 1</th>
  <th colspan="2">Set 2</th>
  <th colspan="2">Set 3</th>
</tr>
<tr>
  <th>A</th><th>B</th>
  <th>A</th><th>B</th>
  <th>A</th><th>B</th>
</tr>
</thead>

<tbody id="tbodyResultados"></tbody>
</table>

<hr>

<h2>📊 Tabla de Posiciones</h2>

<table>
<thead>
<tr>
  <th>Equipo</th>
  <th>PJ</th>
  <th>PG</th>
  <th>PP</th>
  <th>Sets +</th>
  <th>Sets -</th>
  <th>Puntos</th>
</tr>
</thead>

<tbody id="tbodyPosiciones"></tbody>
</table>

<!-- scripts -->
<script type="module" src="script.js"></script>
<script type="module" src="resultadosEcuavoley.js"></script>
<script type="module" src="posicionesEcuavoley.js"></script>

</body>
</html>
